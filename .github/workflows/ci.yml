name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: stable }
          - { os: macos-latest, go: stable }
          - { os: windows-latest, go: stable }
          - { os: ubuntu-latest, go: "1.25" } # the minimum in go.mod
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        shell: bash
        run: |
          # The race detector needs cgo, which the Windows runner is not set up for.
          if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
